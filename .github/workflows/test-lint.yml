name: Test + Lint
on:
  pull_request:
permissions: {contents: read}
concurrency: {group: 'test-lint-${{ github.event.pull_request.number }}', cancel-in-progress: true}
jobs:
  test-lint:
    uses: caty-ai/family-dev-handbook/.github/workflows/reusable-test-lint.yml@ci-v1
    permissions: {contents: read}
    with:
      run_macos: true
      require_suite_reconciliation: true
      # Honest accounting (seat-reviewed on PR #47, re-measured for #58).
      # Most of this suite is Darwin-native (BSD date -v / stat -f,
      # sandbox-exec, launchd, the pinned gitleaks/git contract paths).
      # Measured on run 32474196361, all three lanes at declared=30:
      #   ubuntu       executed=8  skipped=22  (portable subset + lint +
      #                the reconciliation arithmetic itself)
      #   this lane's  executed=25 skipped=5   (hosted macOS, without the
      #   test-macos                            pinned contract paths)
      #   ci.yml       executed=30 skipped=0   (installs every contract
      #                                         itself, so it runs the full
      #                                         set on EITHER runner —
      #                                         hosted on pull_request,
      #                                         self-hosted on push to main)
      # Cap is tight at today's skip count: 22*100=2200 <= 30*76=2280
      # passes, a 23rd skip (2300) fails.
      # Ratchet DOWN as suites are ported to Linux (follow-up issue #49).
      max_skip_percent: '76'
