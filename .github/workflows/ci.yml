name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No step here needs a token beyond reading the repository (checkout, brew and
# curl installs, and `git fetch origin main` in the whitespace step). Declared
# explicitly rather than inherited: fork pull requests already get a read-only
# token, but same-repository pull requests do not, and every reusable caller in
# this repo already scopes itself this way.
permissions:
  contents: read

jobs:
  guard:
    # GitHub-hosted macos-15 for every event. This repository has no
    # self-hosted runner registered: a pull request can rewrite the very
    # steps this job runs, so on a public repository a fork PR reaching a
    # persistent self-hosted runner would be arbitrary code execution on
    # the owner's machine. Hosted runners give fork pull requests a
    # read-only token, no secrets, and a throwaway VM — the properties we
    # actually want here. (A Mac mini runner briefly served push-to-main
    # while the repo was private, purely to avoid the 10x hosted-macOS
    # minute rate; public repositories get hosted minutes free, so the
    # reason for it is gone.)
    #
    # Every contract-install step below either provisions its own
    # dependency when absent (shellcheck, gitleaks, the git shim) or
    # verifies an image-supplied one loudly (jq, sandbox-exec, brew git
    # are asserted, not provisioned — they fail the job if the image
    # stops shipping them), and "Assert zero skips" fails the job on any
    # lost coverage, so the full 30-suite contract runs here with no
    # silent dependency on the runner image.
    #
    # Kept as ONE job on purpose: the job name is what branch protection
    # requires, and splitting it would change the check names.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
          shellcheck --version

      - name: Install pinned gitleaks path
        # The binary hash is verified on EVERY run (not only on install) so
        # a tampered or stale binary fails the job instead of being trusted
        # by presence alone.
        run: |
          gitleaks_bin=/opt/homebrew/Cellar/gitleaks/8.30.1/bin/gitleaks
          gitleaks_sha256=ba52fb1bfabbcde42f032afad3d6e0b19dff8ed105229a16e7caa338bbc0e84f
          if [ ! -x "$gitleaks_bin" ]; then
            curl -L \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            mkdir -p /tmp/gitleaks
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
            install -d "$(dirname "$gitleaks_bin")" 2>/dev/null ||
              sudo -n install -d "$(dirname "$gitleaks_bin")"
            install -m 0755 /tmp/gitleaks/gitleaks "$gitleaks_bin" 2>/dev/null ||
              sudo -n install -m 0755 /tmp/gitleaks/gitleaks "$gitleaks_bin"
          fi
          printf '%s  %s\n' "$gitleaks_sha256" "$gitleaks_bin" | shasum -a 256 -c -
          "$gitleaks_bin" version

      - name: Install Git compatibility path shim
        # Non-sudo first in case /opt/homebrew is user-owned (and brew
        # cleanup can remove the shim dir on git upgrades, so this also
        # self-heals); sudo -n is the fallback and fails fast instead of
        # hanging on a password prompt.
        run: |
          shim=/opt/homebrew/Cellar/git/2.48.1/bin/git
          if [ ! -x "$shim" ]; then
            install -d "$(dirname "$shim")" 2>/dev/null ||
              sudo -n install -d "$(dirname "$shim")"
            ln -sf "$(command -v git)" "$shim" 2>/dev/null ||
              sudo -n ln -sf "$(command -v git)" "$shim"
          fi
          actual_version=$("$shim" --version)
          echo "Compatibility shim actual ${actual_version}"
          printf '%s\n' "$actual_version" |
            grep -E '^git version [0-9]+(\.[0-9]+){1,3}([.-].*| .*)?$'

      - name: Verify system jq contract
        run: |
          test -x /usr/bin/jq
          /usr/bin/jq --version

      - name: Verify sandbox-exec contract
        # The sandbox measurement suite silently skips wherever sandbox-exec
        # is absent; this lane is the one place that must fail instead
        # (deprecated Apple tool — detect its disappearance loudly).
        run: command -v sandbox-exec

      - name: Verify brew git contract
        # Several test suites invoke /opt/homebrew/bin/git directly; hosted
        # macos-15 ships it via brew. Fail fast with a clear message if it
        # is gone.
        run: |
          test -x /opt/homebrew/bin/git
          /opt/homebrew/bin/git --version

      - name: Bash syntax
        # One bash -n per file: `bash -n a.sh b.sh` only checks the first
        # file and treats the rest as script arguments.
        run: |
          for f in guard/*.sh lanes/**/*.sh tests/*.sh; do
            bash -n "$f"
          done
          bash -n bin/oc-suggest
          bash -n lanes/org-consistency/seat.sh
          bash -n tests/fixtures/org-consistency/fake-gh.sh
          bash -n tests/fixtures/org-consistency/fake-seat.sh
          bash -n tests/test_lane_org_consistency_layer2.sh
          bash -n tests/test_lane_org_consistency_layer3.sh
          bash -n tests/test_lane_org_consistency_oc_bcd.sh
          bash -n tests/test_lane_org_consistency_s4_residuals.sh
          bash -n tests/test_lane_org_consistency_suggest.sh

      - name: ShellCheck changed publisher surface
        # -e SC2015 mirrors the Makefile lint exclusion (pre-existing style
        # debt in guard/*.sh) so the two lint lanes stay semantically aligned.
        run: |
          shellcheck -e SC2015 \
            guard/common.sh \
            guard/broker.sh \
            guard/gateway.sh \
            guard/drift-monitor.sh \
            guard/publisher.sh \
            guard/publisher-lib.sh \
            guard/publisher-askpass.sh \
            guard/remote-preflight.sh \
            bin/oc-suggest \
            tests/test_guard_publisher.sh \
            tests/test_guard_drift_monitor.sh \
            tests/test_guard_revocation_runbook.sh \
            tests/test_publication_gate_selftest.sh \
            tests/test_publication_gate_repo.sh \
            tests/test_publication_denylist.sh \
            lanes/org-consistency/run.sh \
            lanes/org-consistency/seat.sh \
            tests/test_lane_org_consistency_core.sh \
            tests/test_lane_org_consistency_lifecycle.sh \
            tests/test_lane_org_consistency_layer2.sh \
            tests/test_lane_org_consistency_layer3.sh \
            tests/test_lane_org_consistency_mutation.sh \
            tests/test_lane_org_consistency_oc_a.sh \
            tests/test_lane_org_consistency_oc_bcd.sh \
            tests/test_lane_org_consistency_s4_residuals.sh \
            tests/test_lane_org_consistency_suggest.sh \
            tests/test_lane_org_consistency_targets_mirrors.sh \
            tests/test_lane_org_consistency_timebox.sh \
            tests/fixtures/org-consistency/fake-gh.sh \
            tests/fixtures/org-consistency/fake-seat.sh \
            tests/fixtures/org-consistency/lib.sh \
            tests/run_tests.sh

      - name: Tests
        # shell: bash gives bash -eo pipefail (GitHub's default `bash -e {0}`
        # has NO pipefail, so `| tee` would swallow the suite's exit code —
        # seat finding D1 on PR #47).
        shell: bash
        run: /bin/bash tests/run_tests.sh 2>&1 | tee /tmp/full-contract-test.log

      - name: Assert zero skips (full-contract lane)
        # This runner installs every suite contract above, so any skip here
        # means a contract silently broke — fail instead of shrinking coverage
        # (seat finding M2 on PR #47: skip accounting existed only on ubuntu).
        run: |
          grep -E 'suites: declared=[0-9]+ executed=[0-9]+ skipped=0$' \
            /tmp/full-contract-test.log

      # PR-range gitleaks moved to the reusable caller
      # .github/workflows/gitleaks.yml (family-dev-handbook@ci-v1); the
      # in-repo copy was removed so scan logic lives in exactly one place.

      - name: Diff whitespace
        run: |
          git fetch origin main
          base=$(git merge-base origin/main HEAD)
          git diff --check "$base"..HEAD
